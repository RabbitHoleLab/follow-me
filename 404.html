<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 // REALITY NOT FOUND — FOLLOW ME</title>
  <style>
    :root { color-scheme: dark; --green:#86eaa1; --dim:#a3bca9; --red:#ff9b99; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:20px; background:#020907; color:#e1ffe9; font-family:Consolas,"Courier New",monospace; }
    #rain { position:fixed; inset:0; width:100%; height:100%; opacity:.28; pointer-events:none; }
    main { position:relative; z-index:1; width:min(100%,560px); padding:clamp(24px,5vw,44px); background:rgba(3,12,7,.94); border:1px solid #416a4a; box-shadow:0 0 55px #20552b22; text-align:center; }
    .eyebrow { color:var(--green); font-size:11px; letter-spacing:2px; line-height:1.6; }
    h1 { font-size:clamp(76px,17vw,128px); font-weight:400; line-height:1; margin:22px 0 10px; text-shadow:0 0 30px #4bd87a55; }
    h2 { font-size:clamp(18px,4vw,25px); font-weight:400; color:var(--red); letter-spacing:2px; margin:0 0 24px; }
    p { color:var(--dim); font-size:13px; line-height:1.85; white-space:pre-line; }
    #question { color:#e1ffe9; font-size:17px; min-height:44px; }
    .divider { height:1px; background:#2a4732; margin:26px 0; }
    .status { color:var(--green); font-size:11px; letter-spacing:2px; }
    .track { height:8px; margin:20px 0 10px; background:#18311f; border:1px solid #355a3d; overflow:hidden; display:none; }
    .bar { width:0%; height:100%; background:var(--green); box-shadow:0 0 12px var(--green); transition:width .1s linear; }
    button, a.action { display:block; width:100%; margin-top:12px; padding:14px; border:1px solid var(--green); background:transparent; color:var(--green); font:inherit; font-size:12px; letter-spacing:1px; cursor:pointer; text-decoration:none; }
    button:hover, button:focus-visible, a.action:hover, a.action:focus-visible { background:var(--green); color:#031006; outline-offset:3px; }
    a.secondary { border-color:#57705d; color:#bed2c1; }
    .hidden { display:none !important; }
    .fineprint { margin-top:25px; color:#5f8069; font-size:10px; }
    @media (prefers-reduced-motion:reduce) { .bar { transition:none; } }
  </style>
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <main>
    <div class="eyebrow">FOLLOW ME // SYSTEM ERROR</div>
    <h1>404</h1>
    <h2 id="heading">REALITY NOT FOUND</h2>
    <p id="description">You found a page that doesn't exist.</p>
    <p id="question">ARE YOU SURE YOU EXIST?</p>
    <div class="divider"></div>
    <div class="status" id="status" role="status" aria-live="polite">RECOVERY PATH DETECTED</div>
    <div class="track" id="track"><div class="bar" id="bar"></div></div>
    <button id="recover" type="button">RESTORE MISSING EXIT</button>
    <a id="return" class="action secondary hidden" href="/follow-me/">RETURN TO THE BEGINNING</a>
    <p class="fineprint">ERROR 404 // NOTHING WAS REMOVED FROM REALITY</p>
  </main>
  <script>
    "use strict";
    // The path is absolute so it works even when a missing URL is deeply nested.
    const HOME = "/follow-me/";
    document.getElementById("return").href = HOME;
    const recover = document.getElementById("recover");
    const status = document.getElementById("status");
    const heading = document.getElementById("heading");
    const description = document.getElementById("description");
    const question = document.getElementById("question");
    const track = document.getElementById("track");
    const bar = document.getElementById("bar");
    const back = document.getElementById("return");
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let running = false;
    let attempts = 0;
    const wait = ms => new Promise(resolve => setTimeout(resolve, reduced ? 0 : ms));

    recover.addEventListener("click", async () => {
      if (running) return;
      attempts++;
      running = true;
      recover.disabled = true;
      track.style.display = "block";
      bar.style.width = "0%";
      heading.textContent = "RECOVERY IN PROGRESS";
      question.textContent = "PLEASE REMAIN WHERE YOU ARE.";
      description.textContent = "Searching for missing exit...";
      status.textContent = "SCANNING SYSTEM";
      for (const [value, label] of [[12,"CHECKING ROUTES"],[39,"SEARCHING BACKUPS"],[71,"VERIFYING REALITY"],[99,"ALMOST THERE"]]) {
        bar.style.width = value + "%";
        status.textContent = label + " // " + value + "%";
        await wait(650);
      }
      await wait(700);
      heading.textContent = "RECOVERY FAILED";
      description.textContent = attempts === 1
        ? "We located the exit.\nUnfortunately, it was another entrance."
        : "We checked again.\nIt is still an entrance.";
      question.textContent = "YOU WERE NEVER LOCKED IN.";
      status.textContent = "ERROR: USER CONTINUES FOLLOWING INSTRUCTIONS";
      recover.textContent = attempts === 1 ? "RETRY THE IMPOSSIBLE" : "AGAIN? REALLY?";
      back.classList.remove("hidden");
      recover.disabled = false;
      running = false;
    });

    // Decorative rain only. Respect reduced-motion preferences.
    const canvas = document.getElementById("rain");
    const ctx = canvas.getContext("2d");
    const fontSize = 16;
    const chars = "01アイウエオカキクケコ";
    let drops = [];
    let width = 0, height = 0;
    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      width = innerWidth; height = innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      drops = Array.from({length:Math.ceil(width/fontSize)}, () => Math.random()*-50);
      ctx.fillStyle = "#020907"; ctx.fillRect(0,0,width,height);
    }
    function draw() {
      ctx.fillStyle = "rgba(2,9,7,.11)"; ctx.fillRect(0,0,width,height);
      ctx.font = fontSize + "px monospace"; ctx.fillStyle = "#65df85";
      drops.forEach((drop,i) => {
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*fontSize,drop*fontSize);
        drops[i] = drop*fontSize>height && Math.random()>.98 ? 0 : drop+.5;
      });
    }
    addEventListener("resize",resize);
    resize();
    if (!reduced) setInterval(draw,55);
  </script>
</body>
</html>
