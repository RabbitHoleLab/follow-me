
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:type" content="website">
  <meta property="og:title" content="FOLLOW ME — The Choice Illusion">
  <meta property="og:description" content="What kind of player are you ?">
  <meta property="og:image" content="https://rabbitholelab.github.io/follow-me/assets/images/share.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">

  <title>Follow Me | RabbitHoleLab</title>

  <style>

    /* ==========================================
       GENERAL
    ========================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #020907;
      color: #e1ffe9;
      font-family: Arial, sans-serif;
    }

    #matrix {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .65;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 180px 20px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 28px;
      text-align: center;
    }

    /* ==========================================
       TITLE
    ========================================== */

    h1 {
      position: absolute;
      top: 9vh;
      left: 20px;
      right: 20px;
      margin: 0;
      font-size: clamp(23px, 3.6vw, 43px);
      letter-spacing: 3px;
      text-shadow: 0 0 22px #18a755;
      transition: opacity 1.2s ease;
    }

    h1.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    
    /* MOBILE — TITLE */
    
    h1 {
      top: 25px;
      font-size: clamp(18px, 5vw, 25px);
      letter-spacing: 1px;
      line-height: 1.3;
    }
    
    /* MOBILE — SPACE FOR TITLE */
    
    main {
      padding-top: 125px;
      padding-bottom: 35px;
    }

    /* ==========================================
       CHARACTER GRID
    ========================================== */

    .heroes {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      width: min(1100px, 100%);
      transition:
        opacity 1s ease,
        transform 1s ease;
    }

    .hero {
      position: relative;
      min-width: 0;
      overflow: hidden;
      padding: 0;
      border: 2px solid var(--accent);
      border-radius: 13px;
      background: #06100c;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 15px var(--glow);
      transition:
        transform .5s ease,
        box-shadow .5s ease,
        opacity .7s ease,
        filter .7s ease;
    }

    /* Character colors */

    .hero.blue {
      --accent: #51baff;
      --glow: rgba(40, 150, 255, .3);
    }

    .hero.red {
      --accent: #ff5a55;
      --glow: rgba(255, 50, 40, .3);
    }

    /* Hover effects */

    .hero:hover,
    .hero:focus-visible {
      transform: translateY(-9px) scale(1.025);
      box-shadow: 0 0 35px var(--accent);
      outline: none;
    }

    .hero:focus-visible {
      outline: 2px solid #e1ffe9;
      outline-offset: 3px;
    }

    /* Character portraits */

    .hero img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1.5;
      object-fit: cover;
      object-position: center top;
    }

    /* Character names */

    .hero-name {
      display: block;
      padding: 14px 5px;
      background: rgba(0, 0, 0, .88);
      font-family: Georgia, serif;
      font-size: clamp(12px, 1.5vw, 20px);
      letter-spacing: 1px;
    }

    /* ==========================================
       SUBTITLE AND MESSAGES
    ========================================== */

    .subtitle {
      margin: 0;
      transform: translateY(15px);
      color: #8de4a4;
      letter-spacing: 2px;
      transition: opacity .5s ease;
    }

    #message {
      min-height: 28px;
      color: #e1ffe9;
      font-size: 18px;
      text-shadow: 0 0 15px #18a755;
      transition: opacity .5s ease;
    }

    #message.revelation {
      font-size: clamp(22px, 3vw, 38px);
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 25px #57d98b;
    }

    /* ==========================================
       CHARACTER SELECTION ANIMATION
    ========================================== */

    .heroes.has-selection .hero:not(.selected) {
      opacity: .15;
      filter: grayscale(1);
      transform: scale(.94);
    }

    .heroes.has-selection .hero.selected,
    .heroes.has-selection .hero.selected:hover {
      transform: scale(1.06);
      box-shadow:
        0 0 25px var(--accent),
        0 0 65px var(--glow);
      z-index: 2;
    }

    .heroes.vanish {
      opacity: 0;
      transform: scale(.94);
      pointer-events: none;
    }
    
    /* ==========================================
       REVELATION — CENTER ON SCREEN
    ========================================== */
    
    main.revelation-mode {
      justify-content: center;
    }
    
    main.revelation-mode .heroes {
      position: absolute;
      visibility: hidden;
      pointer-events: none;
    }
    
    main.revelation-mode .subtitle {
      position: absolute;
      visibility: hidden;
    }
    
    main.revelation-mode #message {
      position: relative;
      width: 100%;
      max-width: 1000px;
    }
    
    main.revelation-mode #ending {
      position: absolute;
      top: calc(50% + 75px);
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 30px);
    }
    
    /* ==========================================
       END SCREEN
       Space reserved to prevent layout shifts
    ========================================== */

    #ending {
      display: flex;
      visibility: hidden;
      opacity: 0;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      min-height: 105px;
      transition: opacity 1s ease;
    }

    #ending.visible {
      visibility: visible;
      opacity: 1;
    }
    
    
    /* ==========================================
       THE CAPSULE — PHOTOREALISTIC IMAGE
       Decorative, never clickable
    ========================================== */
    
    #choice-capsule {
      display: none;
      width: 180px;
      max-width: 65vw;
      height: auto;
    
      object-fit: contain;
      pointer-events: none;
    
      filter: drop-shadow(
        0 0 15px rgba(255, 255, 255, 0.15)
      );
    }
    
    /* Capsule above the message */
    main.endless-loop #choice-capsule {
      display: block;
      position: absolute;
    
      left: 50%;
      top: calc(50% - 170px);
    
      transform: translateX(-50%);
      z-index: 2;
    }
    
    /* Keep the question centered */
    main.endless-loop #message {
      position: relative;
      z-index: 1;
    }
    
    /* Ending below the question */
    main.endless-loop #ending {
      top: calc(50% + 85px);
    }
    
    /* Mobile */
    @media (max-width: 700px) {
      main.endless-loop #choice-capsule {
        width: 135px;
        top: calc(50% - 145px);
      }
    
      main.endless-loop #ending {
        top: calc(50% + 105px);
      }
    }

    /* ==========================================
       PLAY AGAIN BUTTON
    ========================================== */

    #play-again {
      padding: 13px 32px;
      border: 1px solid #57d98b;
      border-radius: 30px;
      background: rgba(0, 20, 10, .8);
      color: #caffd8;
      font-size: 14px;
      letter-spacing: 3px;
      cursor: pointer;
      transition:
        background .3s,
        box-shadow .3s,
        transform .3s;
    }

    #play-again:hover,
    #play-again:focus-visible {
      background: rgba(25, 90, 45, .5);
      box-shadow: 0 0 25px #57d98b;
      transform: scale(1.06);
    }

    /* ==========================================
       RESPONSIVE — MOBILE
    ========================================== */

    @media (max-width: 700px) {

    /* ==========================================
         MOBILE — MAIN LAYOUT
      ========================================== */
      
      main {
        min-height: 100dvh;
        padding: 35px 14px 45px;
        justify-content: flex-start;
        gap: 20px;
      }
      
      /* ==========================================
         MOBILE — TITLE
      ========================================== */
      
      h1 {
        position: relative;
        top: auto;
        left: auto;
        right: auto;
      
        width: 100%;
        max-width: 420px;
      
        margin: 0 0 12px;
      
        font-size: clamp(18px, 5vw, 24px);
        line-height: 1.35;
        letter-spacing: 1px;
      }
      
      /* ==========================================
         MOBILE — REVELATION MODE
      ========================================== */
      
      main.revelation-mode {
        justify-content: center;
        padding: 30px 14px;
      }
      
      main.revelation-mode h1 {
        position: absolute;
      }

      .heroes {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        max-width: 460px;
      }

      .hero-name {
        font-size: 13px;
        padding: 11px 3px;
      }
      
      /* ==========================================
         MOBILE — SMALLER CHARACTER CARDS
      ========================================== */
      
      .heroes {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      
        width: 85%;
        max-width: 390px;
      
        margin-left: auto;
        margin-right: auto;
      }

    }

    /* ==========================================
       ACCESSIBILITY
    ========================================== */

    @media (prefers-reduced-motion: reduce) {

      .hero,
      .heroes,
      #ending,
      #message,
      .subtitle,
      #play-again {
        transition: none;
      }

    }

  </style>
</head>

<body>

  <!-- ========================================
       MATRIX BACKGROUND
  ========================================= -->

  <canvas id="matrix" aria-hidden="true"></canvas>

  <!-- ========================================
       MAIN CONTENT
  ========================================= -->

  <main>

    <h1>WHAT KIND OF PLAYER ARE YOU ?</h1>

    <!-- CHARACTER SELECTION -->

    <section class="heroes" aria-label="Choose your character">

      <button
        type="button"
        class="hero blue"
        data-name="THE GUARDIAN"
      >
        <img
          src="assets/images/guardian.webp"
          alt="The Guardian"
        >
        <span class="hero-name">THE GUARDIAN</span>
      </button>

      <button
        type="button"
        class="hero blue"
        data-name="THE DREAMER"
      >
        <img
          src="assets/images/dreamer.webp"
          alt="The Dreamer"
        >
        <span class="hero-name">THE DREAMER</span>
      </button>

      <button
        type="button"
        class="hero red"
        data-name="THE REBEL"
      >
        <img
          src="assets/images/rebel.webp"
          alt="The Rebel"
        >
        <span class="hero-name">THE REBEL</span>
      </button>

      <button
        type="button"
        class="hero red"
        data-name="THE SEEKER"
      >
        <img
          src="assets/images/seeker.webp"
          alt="The Seeker"
        >
        <span class="hero-name">THE SEEKER</span>
      </button>

    </section>

    <!-- SUBTITLE -->

    <p class="subtitle">CHOOSE YOUR CHARACTER</p>

    <!-- REVELATION MESSAGES -->

    <!-- Decorative capsule: endless loop only -->
    <img
      id="choice-capsule"
      src=""
      alt=""
      aria-hidden="true"
    >
    
    <!-- Revelation messages -->
    <div
      id="message"
      role="status"
      aria-live="polite"
    ></div>

    <!-- END SCREEN -->

    <div id="ending">

      <p>Every ending is another beginning</p>

      <button id="play-again" type="button">
        ↻ PLAY AGAIN
      </button>

    </div>

  </main>

  <script>

    /* ==========================================
       MATRIX RAIN
    ========================================== */

    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    const fontSize = 16;

    // ==========================================
    // MATRIX COLOR EFFECT
    // ==========================================

    let matrixColor = "#57d98b";

    const chars =
      "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオカキクケコ";

    let drops = [];
    let width, height;

    // Resize canvas

    function resize() {

      const dpr = Math.min(devicePixelRatio || 1, 2);

      width = innerWidth;
      height = innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      drops = Array.from(
        { length: Math.ceil(width / fontSize) },
        () => Math.random() * -60
      );

      ctx.fillStyle = "#020907";
      ctx.fillRect(0, 0, width, height);

    }

    // Draw Matrix rain

    function draw() {

      ctx.fillStyle = "rgba(2,9,7,.12)";
      ctx.fillRect(0, 0, width, height);

      ctx.font = fontSize + "px monospace";
      ctx.fillStyle = matrixColor;

      drops.forEach((drop, i) => {

        const char =
          chars[Math.floor(Math.random() * chars.length)];

        ctx.fillText(
          char,
          i * fontSize,
          drop * fontSize
        );

        drops[i] =
          drop * fontSize > height && Math.random() > .98
            ? 0
            : drop + .48;

      });

    }

    // Initialize Matrix

    addEventListener("resize", resize);

    resize();

    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      setInterval(draw, 55);
    } else {
      draw();
    }

    

    /* ==========================================
       CHARACTER SELECTION
    ========================================== */
    
    const main = document.querySelector("main");
    const heroes = document.querySelector(".heroes");
    const cards = document.querySelectorAll(".hero");

    const message = document.getElementById("message");
    const subtitle = document.querySelector(".subtitle");
    const title = document.querySelector("h1");

    const ending = document.getElementById("ending");
    const capsule = document.getElementById("choice-capsule");
    const replay = document.getElementById("play-again");

    const reducedMotion =
      matchMedia("(prefers-reduced-motion: reduce)").matches;

    let playing = false;
    
    /* ==========================================
       PLAYER PROGRESSION
       Saved in the browser
    ========================================== */
    
    const progressKey = "follow-me-progress";
    
    let attemptCount = Number(
      localStorage.getItem(progressKey) || 0
    );

    // Wait helper

    const wait = ms =>
      new Promise(resolve =>
        setTimeout(resolve, reducedMotion ? 0 : ms)
      );

    /* ==========================================
       REVELATION TEXT
    ========================================== */

    async function reveal(text, duration = 2600) {

      message.style.opacity = "0";

      await wait(500);

      message.textContent = text;
      message.style.opacity = "1";

      await wait(duration);

    }

    /* ==========================================
       SELECT CHARACTER
    ========================================== */

    async function selectCharacter(card) {

      if (playing) return;

      playing = true;

      // ==========================================
      // MATRIX COLOR EFFECT
      // Blue characters / Red characters
      // ==========================================

      matrixColor = card.classList.contains("blue")
        ? "#51baff"
        : "#ff5a55";

      // Highlight selected character

      heroes.classList.add("has-selection");
      card.classList.add("selected");

      subtitle.textContent = "CHARACTER SELECTED";

      await wait(1900);

      // Make characters disappear

      heroes.classList.add("vanish");
      subtitle.style.opacity = "0";
      title.classList.add("fade-out");

      await wait(1200);

      // Keep the character grid in the layout
      // to avoid a sudden vertical repositioning

      heroes.style.visibility = "hidden";

      main.classList.add("revelation-mode");
      
      message.classList.add("revelation");
      
      /* ==========================================
         ENDLESS LOOP — AFTER THE ANOMALY
      ========================================== */
      
      // The player has already completed
      // the three introductory journeys
      
      if (attemptCount >= 3) {

      // Show a blue or red capsule matching the selected character        
      capsule.src = card.classList.contains("blue")
        ? "assets/images/capsule-blue.png"
        : "assets/images/capsule-red.png";

        main.classList.add("endless-loop");
      
        // Only one message remains
        await reveal(
          "DO YOU REALLY ONLY WANT THAT ?",
          5000
        );
      
        // Show PLAY AGAIN
        requestAnimationFrame(() =>
          requestAnimationFrame(() =>
            ending.classList.add("visible")
          )
        );
      
        // Stop here: skip all original revelations
        return;
      
      }

      // ==========================================
      // PHILOSOPHICAL REVELATION
      // ==========================================

      await reveal("YOU CHOSE A CHARACTER");

      await reveal(
        "BUT WHO CHOSE THE GAME ?",
        3200
      );

      await reveal(
        "YOU'RE THE PLAYER",
        2500
      );

      await reveal(
        "NOT THE CHARACTER",
        3200
      );

      // ==========================================
      // FINAL MESSAGE — BLUE OR RED
      // ==========================================

      const finalMessage = card.classList.contains("blue")
        ? "DON'T FORGET TO LOVE YOURSELF ❤️"
        : "DID YOU REALLY CHOOSE YOURSELF ?";

      await reveal(finalMessage, 5000);

      
      /* ==========================================
         ATTEMPT COUNTER
      ========================================== */
      
      // Count a completed journey
      attemptCount++;
      
      // Save progress for future visits
      localStorage.setItem(
        progressKey,
        String(attemptCount)
      );
      
      /* ==========================================
         REMAINING ATTEMPTS
      ========================================== */
      
      if (attemptCount === 1) {
      
        await reveal(
          "2 ATTEMPTS REMAINING",
          3500
        );
      
      } else if (attemptCount === 2) {
      
        await reveal(
          "1 ATTEMPT REMAINING",
          3500
        );
      
      }
      
      /* ==========================================
         SYSTEM ANOMALY — ONLY ONCE
      ========================================== */
      
      else if (attemptCount === 3) {
      
        matrixColor = "#57d98b";
      
        await reveal(
          "SYSTEM ANOMALY",
          2500
        );
      
        await reveal(
          "EXPAND YOUR MIND",
          3500
        );
      
        await reveal(
          "THINK OUTSIDE THE BOX",
          5000
        );
      
      }
      
      // From the fourth journey onward:
      // no countdown and no anomaly


      // ==========================================
      // SHOW REPLAY OPTION
      // ==========================================

      requestAnimationFrame(() =>
        requestAnimationFrame(() =>
          ending.classList.add("visible")
        )
      );

    }

    // Character click events

    cards.forEach(card => {

      card.addEventListener("click", () => {
        selectCharacter(card);
      });

    });

    /* ==========================================
       PLAY AGAIN — RESET GAME
    ========================================== */

    replay.addEventListener("click", async () => {

      if (!playing || !ending.classList.contains("visible")) {
        return;
      }

      replay.disabled = true;

      // Restore the original Matrix color
      matrixColor = "#57d98b";

      // Hide ending

      ending.classList.remove("visible");
      message.style.opacity = "0";

      await wait(1000);

      main.classList.remove("revelation-mode");
      main.classList.remove("endless-loop");
      capsule.removeAttribute("src");

      // Reset revelation

      message.textContent = "";
      message.classList.remove("revelation");
      message.style.opacity = "1";

      // Reset characters

      cards.forEach(card => {
        card.classList.remove("selected");
      });

      heroes.classList.remove("has-selection");
      heroes.style.visibility = "visible";

      // Fade characters back in

      requestAnimationFrame(() =>
        requestAnimationFrame(() =>
          heroes.classList.remove("vanish")
        )
      );

      // Reset subtitle

      subtitle.textContent = "CHOOSE YOUR CHARACTER";
      subtitle.style.opacity = "1";
      title.classList.remove("fade-out");

      // Unlock game

      replay.disabled = false;
      playing = false;

    });

  </script>

</body>
</html>
