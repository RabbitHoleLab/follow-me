
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow Me | RabbitHoleLab</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #020907;
    color: #e1ffe9;
    font-family: Arial, sans-serif;
  }

  #matrix {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: .65;
    pointer-events: none;
  }

  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 42px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 28px;
    text-align: center;
  }

  /* Espacement du titre et des personnages */
  
  h1 {
    margin-bottom: 28px;
  }
  
  @media (max-width: 700px) {
    h1 {
      margin-bottom: 24px;
    }
  }

  h1 {
    margin: 0;
    font-size: clamp(23px, 3.6vw, 43px);
    letter-spacing: 3px;
    text-shadow: 0 0 22px #18a755;
  }
 
   /* END SCREEN */
   
   #ending {
     display: none;
     opacity: 0;
     flex-direction: column;
     align-items: center;
     gap: 22px;
     transition: opacity 1s ease;
   }
   
   #ending.visible {
     opacity: 1;
   }
   
   #ending p {
     color: #9bcfac;
     font-family: Georgia, serif;
     font-style: italic;
     font-size: clamp(15px, 2vw, 21px);
     letter-spacing: 1px;
   }
   
   #play-again {
     padding: 13px 32px;
     border: 1px solid #57d98b;
     border-radius: 30px;
     background: rgba(0, 20, 10, .8);
     color: #caffd8;
     font-size: 14px;
     letter-spacing: 3px;
     cursor: pointer;
     transition:
       background .3s,
       box-shadow .3s,
       transform .3s;
   }
   
   #play-again:hover {
     background: rgba(25, 90, 45, .5);
     box-shadow: 0 0 25px #57d98b;
     transform: scale(1.06);
   }


  .heroes {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
    width: min(1100px, 100%);
  }

  .hero {
    position: relative;
    min-width: 0;
    overflow: hidden;
    padding: 0;
    border: 2px solid var(--accent);
    border-radius: 13px;
    background: #06100c;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 15px var(--glow);
    transition: transform .3s, box-shadow .3s;
  }

  .hero.blue {
    --accent: #51baff;
    --glow: rgba(40, 150, 255, .3);
  }

  .hero.red {
    --accent: #ff5a55;
    --glow: rgba(255, 50, 40, .3);
  }

  .hero:hover,
  .hero:focus-visible {
    transform: translateY(-9px) scale(1.025);
    box-shadow: 0 0 35px var(--accent);
    outline: none;
  }
  
 .hero img {
   display: block;
   width: 100%;
   aspect-ratio: 1 / 1.5;
   object-fit: cover;
   object-position: center top;
 }

  .hero-name {
    display: block;
    padding: 14px 5px;
    background: rgba(0, 0, 0, .88);
    font-family: Georgia, serif;
    font-size: clamp(12px, 1.5vw, 20px);
    letter-spacing: 1px;
  }

  .subtitle {
    margin: 0;
    color: #8de4a4;
    letter-spacing: 2px;
  }

  #message {
    min-height: 28px;
    color: #e1ffe9;
    font-size: 18px;
    text-shadow: 0 0 15px #18a755;
  }
 
  /* Character selection */
  
  .heroes {
    transition: opacity 1s ease, transform 1s ease;
  }
  
  .heroes.has-selection .hero:not(.selected) {
    opacity: .15;
    filter: grayscale(1);
    transform: scale(.94);
  }
  
  .hero {
    transition:
      transform .5s ease,
      box-shadow .5s ease,
      opacity .7s ease,
      filter .7s ease;
  }
  
  .hero.selected {
    transform: scale(1.06);
    box-shadow:
      0 0 25px var(--accent),
      0 0 65px var(--glow);
    z-index: 2;
  }
  
  .heroes.vanish {
    opacity: 0;
    transform: scale(.94);
    pointer-events: none;
  }
  
  #message {
    transition: opacity .5s ease;
  }
  
  #message.revelation {
    font-size: clamp(22px, 3vw, 38px);
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 25px #57d98b;
  }


  @media (max-width: 700px) {
    main { padding: 30px 14px; gap: 20px; }

    .heroes {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      max-width: 460px;
    }

    .hero-name {
      font-size: 13px;
      padding: 11px 3px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero { transition: none; }
  }
</style>
</head>

<body>
<canvas id="matrix"></canvas>

<main>
  <h1>WHAT KIND OF PLAYER ARE YOU?</h1>

  <section class="heroes" aria-label="Choose your character">
    <button class="hero blue" data-name="THE GUARDIAN">
      <img src="assets/images/guardian.png" alt="The Guardian">
      <span class="hero-name">THE GUARDIAN</span>
    </button>

    <button class="hero blue" data-name="THE DREAMER">
      <img src="assets/images/dreamer.png" alt="The Dreamer">
      <span class="hero-name">THE DREAMER</span>
    </button>

    <button class="hero red" data-name="THE REBEL">
      <img src="assets/images/rebel.png" alt="The Rebel">
      <span class="hero-name">THE REBEL</span>
    </button>

    <button class="hero red" data-name="THE SEEKER">
      <img src="assets/images/seeker.png" alt="The Seeker">
      <span class="hero-name">THE SEEKER</span>
    </button>
  </section>

  <p class="subtitle">CHOOSE YOUR CHARACTER</p>
  <div id="message" role="status" aria-live="polite"></div>
  
  <div id="ending">
    <p>Every ending is another beginning.</p>
    <button id="play-again" type="button">
      ↻ PLAY AGAIN
    </button>
  </div>

</main>

<script>
  // MATRIX RAIN
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");
  const fontSize = 16;
  const chars =
    "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオカキクケコ";

  let drops = [];
  let width, height;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    width = innerWidth;
    height = innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drops = Array.from(
      { length: Math.ceil(width / fontSize) },
      () => Math.random() * -60
    );

    ctx.fillStyle = "#020907";
    ctx.fillRect(0, 0, width, height);
  }

  function draw() {
    ctx.fillStyle = "rgba(2,9,7,.12)";
    ctx.fillRect(0, 0, width, height);
    ctx.font = fontSize + "px monospace";
    ctx.fillStyle = "#57d98b";

    drops.forEach((drop, i) => {
      const char = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(char, i * fontSize, drop * fontSize);

      drops[i] =
        drop * fontSize > height && Math.random() > .98
          ? 0
          : drop + .48;
    });
  }

  addEventListener("resize", resize);
  resize();

  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    setInterval(draw, 55);
  } else {
    draw();
  }

  
  // CHARACTER SELECTION
  const heroes = document.querySelector(".heroes");
  const cards = document.querySelectorAll(".hero");
  const message = document.getElementById("message");
  const subtitle = document.querySelector(".subtitle");

  let playing = false;

  const wait = ms =>
    new Promise(resolve => setTimeout(resolve, ms));

  async function reveal(text, duration = 2600) {
    message.style.opacity = "0";
    await wait(500);

    message.textContent = text;
    message.style.opacity = "1";

    await wait(duration);
  }

  async function selectCharacter(card) {
    if (playing) return;
    playing = true;

    heroes.classList.add("has-selection");
    card.classList.add("selected");
    subtitle.textContent = "CHARACTER SELECTED";

    await wait(1900);

    heroes.classList.add("vanish");
    subtitle.style.opacity = "0";

    await wait(1200);

    heroes.style.display = "none";
    message.classList.add("revelation");

    await reveal("YOU CHOSE A CHARACTER");
    await reveal("BUT WHO CHOSE THE GAME ?", 3200);
    await reveal("YOU'RE THE PLAYER", 2500);
    await reveal("NOT THE CHARACTER", 3200);
    await reveal("DON'T FORGET TO LOVE YOURSELF ❤️", 5000);
  }
 
   // Show the replay option
   const ending = document.getElementById("ending");

   ending.style.display = "flex";

   requestAnimationFrame(() => {
     ending.classList.add("visible");
   });

  cards.forEach(card => {
    card.addEventListener("click", () => {
      selectCharacter(card);
    });
  });
 
 // PLAY AGAIN — reset without reloading
 
 document.getElementById("play-again")
   .addEventListener("click", async () => {
 
     const ending = document.getElementById("ending");
 
     ending.classList.remove("visible");
     message.style.opacity = "0";
 
     await wait(700);
 
     ending.style.display = "none";
     message.textContent = "";
     message.classList.remove("revelation");
     message.style.opacity = "1";
 
     heroes.style.display = "grid";
     heroes.classList.remove("has-selection", "vanish");
 
     cards.forEach(card => {
       card.classList.remove("selected");
     });
 
     subtitle.textContent = "CHOOSE YOUR CHARACTER";
     subtitle.style.opacity = "1";
 
     playing = false;
 });


</script>
</body>
</html>
