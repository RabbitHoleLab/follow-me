
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Follow Me | RabbitHoleLab</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #020907;
    color: #e1ffe9;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.65;
    pointer-events: none;
  }

  main {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  h1 {
    font-size: clamp(24px, 4vw, 42px);
    letter-spacing: 3px;
    text-shadow: 0 0 20px #18a755;
  }

  p {
    color: #8de4a4;
    letter-spacing: 1px;
  }
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<main>
  <h1>WHAT KIND OF PLAYER ARE YOU?</h1>
  <p>Follow the white rabbit...</p>
</main>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

const fontSize = 16;
const characters =
  "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオカキクケコ";

let drops = [];
let width;
let height;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = width * dpr;
  canvas.height = height * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const columns = Math.ceil(width / fontSize);

  drops = Array.from(
    { length: columns },
    () => Math.random() * -60
  );

  ctx.fillStyle = "#020907";
  ctx.fillRect(0, 0, width, height);
}

function draw() {
  ctx.fillStyle = "rgba(2, 9, 7, 0.12)";
  ctx.fillRect(0, 0, width, height);

  ctx.font = fontSize + "px monospace";
  ctx.fillStyle = "#57d98b";

  drops.forEach((drop, i) => {
    const char = characters[
      Math.floor(Math.random() * characters.length)
    ];

    ctx.fillText(
      char,
      i * fontSize,
      drop * fontSize
    );

    if (
      drop * fontSize > height &&
      Math.random() > 0.98
    ) {
      drops[i] = 0;
    } else {
      drops[i] += 0.48;
    }
  });
}

window.addEventListener("resize", resize);
resize();

setInterval(draw, 55);
</script>

</body>
</html>
