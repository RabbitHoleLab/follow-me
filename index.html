<!DOCTYPE html>
<html lang="en">

<!--
  FOLLOW ME // BUILD 0.0.4

  PUBLIC INTERFACE: STABLE
  EXIT PROTOCOL: RELOCATED
  BACKUP STATUS: UNVERIFIED

  NOTE TO MAINTAINERS:
  Do not expose the classified recovery path
  in the public interface.

 TODO: Remove obsolete references before release.

  /CLASSIFIED/
  /DO_NOT_OPEN/

  The old exit should no longer be accessible.
-->


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="FOLLOW ME — The Choice Illusion">
  <meta property="og:description" content="What kind of player are you ?">
  <meta property="og:image" content="https://rabbitholelab.github.io/follow-me/assets/images/share.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/favicon.png">

  <title>Follow Me | RabbitHoleLab</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <!-- ========================================
       MATRIX BACKGROUND
  ========================================= -->

  <canvas id="matrix" aria-hidden="true"></canvas>

  <!-- ========================================
       MAIN CONTENT
  ========================================= -->

  <main>

    <h1>WHAT KIND OF PLAYER ARE YOU ?</h1>

    <!-- CHARACTER SELECTION -->

    <section
      class="heroes"
      aria-label="Choose your character"
    >

      <!-- THE GUARDIAN -->

      <button
        type="button"
        class="hero blue"
        data-name="THE GUARDIAN"
      >
        <img
          src="assets/images/guardian.webp"
          alt="The Guardian"
        >
        <span class="hero-name">THE GUARDIAN</span>
      </button>

      <!-- THE DREAMER -->

      <button
        type="button"
        class="hero blue"
        data-name="THE DREAMER"
      >
        <img
          src="assets/images/dreamer.webp"
          alt="The Dreamer"
        >
        <span class="hero-name">THE DREAMER</span>
      </button>

      <!-- THE REBEL -->

      <button
        type="button"
        class="hero red"
        data-name="THE REBEL"
      >
        <img
          src="assets/images/rebel.webp"
          alt="The Rebel"
        >
        <span class="hero-name">THE REBEL</span>
      </button>

      <!-- THE SEEKER -->

      <button
        type="button"
        class="hero red"
        data-name="THE SEEKER"
      >
        <img
          src="assets/images/seeker.webp"
          alt="The Seeker"
        >
        <span class="hero-name">THE SEEKER</span>
      </button>

    </section>

    <!-- SUBTITLE -->

    <p class="subtitle">CHOOSE YOUR CHARACTER</p>

    <!-- FORBIDDEN ROUTES — unlocked after completed journeys -->
    <nav id="forbidden-routes" class="forbidden-routes" aria-label="Restricted system routes"></nav>

    <!-- ========================================
         DECORATIVE CAPSULE
         Endless loop only
    ========================================= -->

    <img
      id="choice-capsule"
      alt=""
      aria-hidden="true"
    >

    <!-- REVELATION MESSAGES -->

    <div
      id="message"
      role="status"
      aria-live="polite"
    ></div>

    <!-- END SCREEN -->

    <div id="ending">

      <p>Every ending is another beginning</p>

      <button id="play-again" type="button">
        ↻ PLAY AGAIN
      </button>

    </div>

  </main>

  <script src="assets/js/matrix.js" defer></script>
  <script src="assets/js/forbidden-buttons.js" defer></script>
  <script src="assets/js/game.js" defer></script>
  

  <footer class="site-footer">
    <span>© 2026 RABBITHOLELAB · ALL RIGHTS RESERVED</span>
    <a href="URL_NOTION_A_REMPLACER"
       target="_blank"
       rel="noopener noreferrer">
      ABOUT FOLLOW ME
    </a>
  </footer>


</body>
</html>
