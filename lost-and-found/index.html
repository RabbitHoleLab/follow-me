
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOST & FOUND — Rabbit Hole Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #06120e;
      color: #d5f6df;
      font-family: Georgia, serif;
      text-align: center;
    }
    .map {
      position: relative;
      width: min(96vw, 1500px);
      margin: 20px auto;
    }
    .map img {
      display: block;
      width: 100%;
      height: auto;
    }
    .room {
      position: absolute;
      width: 7%;
      height: 8%;
      transform: translate(-50%, -50%);
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }
    .room:hover, .room:focus-visible {
      border-color: #9affc2;
      background: #9affc233;
      outline: none;
    }
    dialog {
      width: min(90vw, 430px);
      padding: 28px;
      border: 1px solid #69d89b;
      border-radius: 12px;
      background: #081b14;
      color: #e2f8e9;
      box-shadow: 0 0 45px #20c76b55;
    }
    dialog::backdrop {
      background: #000b;
    }
    button.close {
      margin-top: 20px;
      padding: 10px 22px;
      background: #173c29;
      color: white;
      border: 1px solid #69d89b;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <main class="map" id="map">
    <img src="map.png" alt="Lost and Found research complex map">
  </main>

  <dialog id="archive">
    <h2 id="room-title"></h2>
    <p id="room-text"></p>
    <button class="close" id="close">CLOSE</button>
  </dialog>

  <script>
    
    const rooms = [
      // [number, centerX%, centerY%, width%, height%]
    
      [1, 17.0, 22.5, 9.0, 18.0],
      [2, 29.5, 22.5, 13.0, 18.0],
      [3, 42.5, 22.5, 10.0, 18.0],
      [4, 53.5, 22.5, 10.0, 18.0],
      [5, 65.0, 22.5, 9.0, 18.0],
      [6, 78.5, 23.5, 13.0, 18.0],
    
      [7, 77.5, 41.5, 11.0, 14.0],
      [8, 60.0, 41.5, 17.0, 14.0],
    
      [9, 57.0, 61.0, 13.0, 13.0],
      [10, 73.5, 61.0, 13.0, 13.0],
    
      [11, 31.0, 80.0, 13.0, 21.0],
      [12, 47.5, 80.0, 15.0, 21.0],
      [13, 16.0, 79.0, 14.0, 18.0],
      [14, 15.0, 56.0, 13.0, 13.0],
      [15, 27.0, 41.5, 13.0, 14.0],
    
      [16, 80.0, 81.0, 11.0, 19.0],
      [17, 67.5, 81.0, 13.0, 19.0]
    ];


    const content = {
      6: "ACCESS DENIED. This sector is sealed.",
      8: "ARCHIVE FRAGMENT (8): The process by which sensory information is selected, organized and interpreted.",
      11: "This room appears to have been redecorated. No explanation has been provided."
    };

    const map = document.getElementById("map");
    const dialog = document.getElementById("archive");

    rooms.forEach(([number, x, y]) => {
      const button = document.createElement("button");
      button.className = "room";
      button.style.left = x + "%";
      button.style.top = y + "%";
      button.setAttribute("aria-label", "Room " + number);
      button.title = "Room " + number;

      button.addEventListener("click", () => {
        document.getElementById("room-title").textContent =
          "ROOM " + String(number).padStart(2, "0");

        document.getElementById("room-text").textContent =
          content[number] ||
          "UNDER CONSTRUCTION. This archive is not yet available.";

        dialog.showModal();
      });

      map.appendChild(button);
    });

    document.getElementById("close").onclick = () => dialog.close();

    dialog.addEventListener("click", event => {
      if (event.target === dialog) dialog.close();
    });
  </script>

</body>
</html>
