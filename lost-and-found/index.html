
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOST & FOUND — Rabbit Hole Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #06120e;
      color: #d5f6df;
      font-family: Georgia, serif;
      text-align: center;
    }
    .map {
      position: relative;
      width: min(96vw, 1500px);
      margin: 20px auto;
    }
    .map img {
      display: block;
      width: 100%;
      height: auto;
    }
    .room {
      position: absolute;
      width: 7%;
      height: 8%;
      transform: translate(-50%, -50%);
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }
    .room:hover, .room:focus-visible {
      border-color: #9affc2;
      background: #9affc233;
      outline: none;
    }
    dialog {
      width: min(90vw, 430px);
      padding: 28px;
      border: 1px solid #69d89b;
      border-radius: 12px;
      background: #081b14;
      color: #e2f8e9;
      box-shadow: 0 0 45px #20c76b55;
    }
    dialog::backdrop {
      background: #000b;
    }
    button.close {
      margin-top: 20px;
      padding: 10px 22px;
      background: #173c29;
      color: white;
      border: 1px solid #69d89b;
      border-radius: 6px;
      cursor: pointer;
    }
   
  </style>
</head>
<body>

  <main class="map" id="map">
    <img src="map.png" alt="Lost and Found research complex map">
  </main>

  <dialog id="archive">
    <h2 id="room-title"></h2>
    <p id="room-text"></p>
    <button class="close" id="close">CLOSE</button>
  </dialog>

  
  <script>
        
   
    const rooms = [
      // [number, centerX%, centerY%, width%, height%]
    
      [1, 21.93, 22.55, 6.5, 14],
      [2, 32.33, 22.18, 11, 16],
      [3, 43.00, 22.68, 9, 15],
      [4, 53.50, 22.50, 9, 15],
      [5, 63.60, 21.93, 8, 15],
      [6, 74.13, 22.80, 10, 14],
    
      [7, 75.27, 40.89, 8, 12],
      [8, 60.00, 41.50, 16, 12],
    
      [9, 59.00, 58.73, 13, 12],
      [10, 73.53, 59.85, 14, 13],
    
      [11, 34.27, 77.82, 12, 18],
      [12, 47.50, 80.00, 14, 17],
      [13, 20.00, 70.26, 12, 16],
      [14, 21.13, 53.65, 9, 10],
      [15, 30.47, 42.50, 10, 12],
    
      [16, 77.13, 77.45, 9, 14],
      [17, 65.07, 79.92, 12, 14]
    ];


    const content = {
      6: "ACCESS DENIED. This sector is sealed.",
      8: "ARCHIVE FRAGMENT (8): The process by which sensory information is selected, organized and interpreted.",
      11: "This room appears to have been redecorated. No explanation has been provided."
    };

    const map = document.getElementById("map");
    const dialog = document.getElementById("archive");

    rooms.forEach(([number, x, y, width, height]) => {
      const button = document.createElement("button");
      button.className = "room";
      button.style.left = x + "%";
      button.style.top = y + "%";
      button.style.width = width + "%";
      button.style.height = height + "%";
      button.setAttribute("aria-label", "Room " + number);
      button.title = "Room " + number;

      button.addEventListener("click", () => {
        document.getElementById("room-title").textContent =
          "ROOM " + String(number).padStart(2, "0");

        document.getElementById("room-text").textContent =
          content[number] ||
          "UNDER CONSTRUCTION. This archive is not yet available.";

        dialog.showModal();
      });

      map.appendChild(button);
    });

    document.getElementById("close").onclick = () => dialog.close();

    dialog.addEventListener("click", event => {
      if (event.target === dialog) dialog.close();
    });
  </script>

</body>
</html>
