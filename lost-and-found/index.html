
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOST & FOUND — Rabbit Hole Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #06120e;
      color: #d5f6df;
      font-family: Georgia, serif;
      text-align: center;
    }
    .map {
      position: relative;
      width: min(96vw, 1500px);
      margin: 20px auto;
    }
    .map img {
      display: block;
      width: 100%;
      height: auto;
    }
    .room {
      position: absolute;
      width: 7%;
      height: 8%;
      transform: translate(-50%, -50%);
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }
    .room:hover, .room:focus-visible {
      border-color: #9affc2;
      background: #9affc233;
      outline: none;
    }
    dialog {
      width: min(90vw, 430px);
      padding: 28px;
      border: 1px solid #69d89b;
      border-radius: 12px;
      background: #081b14;
      color: #e2f8e9;
      box-shadow: 0 0 45px #20c76b55;
    }
    dialog::backdrop {
      background: #000b;
    }
    button.close {
      margin-top: 20px;
      padding: 10px 22px;
      background: #173c29;
      color: white;
      border: 1px solid #69d89b;
      border-radius: 6px;
      cursor: pointer;
    }
    /* TEMPORARY DEBUG MODE */
    .room {
      background: rgba(0, 255, 120, 0.25) !important;
      border: 2px dashed #00ff88 !important;
    }
  </style>
</head>
<body>

  <main class="map" id="map">
    <img src="map.png" alt="Lost and Found research complex map">
  </main>

  <dialog id="archive">
    <h2 id="room-title"></h2>
    <p id="room-text"></p>
    <button class="close" id="close">CLOSE</button>
  </dialog>

  


  <script>
    
    
    const rooms = [
      // [number, centerX%, centerY%, width%, height%]
    
      [1, 16.5, 22.5, 9.0, 17.0],
      [2, 29.5, 22.5, 13.0, 18.0],
      [3, 42.5, 22.5, 10.0, 18.0],
      [4, 53.5, 22.5, 10.0, 18.0],
      [5, 63.0, 22.5, 9.0, 17.0],
      [6, 78.5, 24.0, 12.0, 17.0],
    
      [7, 78.0, 41.0, 10.0, 13.0],
      [8, 60.0, 41.5, 17.0, 14.0],
    
      [9, 57.0, 59.0, 12.0, 12.0],
      [10, 73.5, 61.0, 13.0, 13.0],
    
      [11, 31.5, 78.0, 12.0, 19.0],
      [12, 47.5, 80.0, 15.0, 21.0],
      [13, 16.0, 70.0, 14.0, 16.0],
      [14, 15.0, 53.0, 12.0, 12.0],
      [15, 27.0, 41.0, 12.0, 13.0],
    
      [16, 81.0, 78.0, 10.0, 16.0],
      [17, 67.5, 78.0, 12.0, 16.0]
    ];



    const content = {
      6: "ACCESS DENIED. This sector is sealed.",
      8: "ARCHIVE FRAGMENT (8): The process by which sensory information is selected, organized and interpreted.",
      11: "This room appears to have been redecorated. No explanation has been provided."
    };

    const map = document.getElementById("map");
    const dialog = document.getElementById("archive");

    rooms.forEach(([number, x, y, width, height]) => {
      const button = document.createElement("button");
      button.className = "room";
      button.style.left = x + "%";
      button.style.top = y + "%";
      button.setAttribute("aria-label", "Room " + number);
      button.title = "Room " + number;

      button.addEventListener("click", () => {
        document.getElementById("room-title").textContent =
          "ROOM " + String(number).padStart(2, "0");

        document.getElementById("room-text").textContent =
          content[number] ||
          "UNDER CONSTRUCTION. This archive is not yet available.";

        dialog.showModal();
      });

      map.appendChild(button);
    });

    document.getElementById("close").onclick = () => dialog.close();

    dialog.addEventListener("click", event => {
      if (event.target === dialog) dialog.close();
    });
  </script>
  <script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get("calibrate") !== "1") return;

  const map = document.querySelector(".map");
  const image = map?.querySelector("img");
  const buttons = [...document.querySelectorAll(".room")];
  if (!map || !image || !buttons.length) return;

  let selected = 1;

  const panel = document.createElement("div");
  panel.style.cssText = `
    position:fixed;top:12px;right:12px;z-index:9999;
    background:#081b14;color:#eaffee;padding:15px;
    border:1px solid #7cffaa;border-radius:10px;
    font:14px Arial;max-width:290px;
    box-shadow:0 0 20px #0009;
  `;

  panel.innerHTML = `
    <strong>MAP CALIBRATION</strong>
    <p>Select a room, then click its center on the map.</p>
    <select id="cal-room"></select>
    <p id="cal-status"></p>
    <button id="cal-copy">COPY COORDINATES</button>
    <button id="cal-exit">EXIT</button>
  `;
  document.body.appendChild(panel);

  const select = panel.querySelector("#cal-room");
  const status = panel.querySelector("#cal-status");

  const positions = buttons.map((button, i) => ({
    number: i + 1,
    x: parseFloat(button.style.left),
    y: parseFloat(button.style.top),
    width: parseFloat(button.style.width),
    height: parseFloat(button.style.height)
  }));

  positions.forEach(room => {
    const option = document.createElement("option");
    option.value = room.number;
    option.textContent = "ROOM " + String(room.number).padStart(2, "0");
    select.appendChild(option);
  });

  select.onchange = () => {
    selected = Number(select.value);
    updateStatus();
  };

  function updateStatus() {
    const room = positions[selected - 1];
    status.textContent =
      `ROOM ${selected}: X ${room.x.toFixed(2)}% / Y ${room.y.toFixed(2)}%`;
  }

  buttons.forEach(button => {
    button.style.background = "rgba(0,255,120,.15)";
    button.style.border = "2px dashed #00ff88";
    button.style.pointerEvents = "none";
  });

  image.style.cursor = "crosshair";

  map.addEventListener("click", event => {
    const rect = image.getBoundingClientRect();

    const x = (event.clientX - rect.left) / rect.width * 100;
    const y = (event.clientY - rect.top) / rect.height * 100;

    if (x < 0 || x > 100 || y < 0 || y > 100) return;

    const room = positions[selected - 1];
    room.x = Number(x.toFixed(2));
    room.y = Number(y.toFixed(2));

    const button = buttons[selected - 1];
    button.style.left = room.x + "%";
    button.style.top = room.y + "%";

    updateStatus();
  });

  panel.querySelector("#cal-copy").onclick = async () => {
    const code = "const rooms = [\n" +
      positions.map(r =>
        `  [${r.number}, ${r.x}, ${r.y}, ${r.width}, ${r.height}]`
      ).join(",\n") +
      "\n];";

    try {
      await navigator.clipboard.writeText(code);
      status.textContent = "Coordinates copied!";
    } catch {
      const area = document.createElement("textarea");
      area.value = code;
      panel.appendChild(area);
      area.select();
      status.textContent = "Copy the selected text.";
    }
  };

  panel.querySelector("#cal-exit").onclick = () => {
    location.href = location.pathname;
  };

  updateStatus();
})();
</script>


</body>
</html>
